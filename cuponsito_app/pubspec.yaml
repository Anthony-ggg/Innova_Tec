name: cuponsito_app
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ^3.35.0

dependencies:
  bloc: ^9.0.1
  curved_navigation_bar: ^1.0.6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  iconsax_flutter: ^1.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  image: ^4.0.0
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

flutter:
  generate: true
  uses-material-design: true

# ===== FLUTTER LAUNCHER ICONS =====
# NOTA: Esta configuración solo genera iconos base.
# Para iconos específicos por flavor en Android, usa:
#   dart run tool/generate_flavor_icons.dart
#
# Los iconos de iOS por flavor ya están configurados correctamente
# en ios/Runner/Assets.xcassets/

flutter_launcher_icons:
  # REQUIRED fallback
  image_path: assets/icon/prod.png

  # ===== ANDROID =====
  # Iconos base en android/app/src/main/res/
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/prod.png

  # ===== IOS =====
  # iOS soporta múltiples iconos por flavor nativamente
  ios: true
  remove_alpha_ios: true
  image_path_ios: assets/icon/prod.png

  # ===== WEB =====
  web:
    generate: true
    image_path: assets/icon/prod.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

  # ===== WINDOWS =====
  windows:
    generate: true
    image_path: assets/icon/prod.png
    icon_size: 256

  # ===== MACOS =====
  macos:
    generate: true
    image_path: assets/icon/prod.png

  # ===== LINUX =====
  linux:
    generate: true
    image_path: assets/icon/prod.png
