<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "primary-dark": "#0dbd49",
                        "background-light": "#f8faf9",
                        "background-dark": "#0a120d",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "lg": "1.25rem",
                        "xl": "1.75rem",
                        "2xl": "2.25rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        :root {
            --primary-glow: rgba(19, 236, 91, 0.15);
        }
        .mesh-gradient {
            background-color: #f8faf9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(19, 236, 91, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(19, 236, 91, 0.05) 0px, transparent 50%);
        }
        .dark .mesh-gradient {
            background-color: #0a120d;
            background-image: 
                radial-gradient(at 0% 0%, rgba(19, 236, 91, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(19, 236, 91, 0.02) 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-card {
            background: rgba(26, 46, 33, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <title>CUPONEA - Iniciar Sesión</title>

</head>

<body class="mesh-gradient font-display text-[#111813] dark:text-white transition-colors duration-300 min-h-screen">
    <div class="relative flex min-h-screen w-full flex-col max-w-[480px] mx-auto overflow-x-hidden">
        <div class="flex items-center p-6 pb-2 justify-between sticky top-0 z-20">
            <div class="w-10 h-10 flex items-center justify-start">
                <button
                    class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10">
                    <span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
                </button>
            </div>
            <h2
                class="text-[#111813] dark:text-white text-base font-extrabold leading-tight tracking-tight flex-1 text-center uppercase">
                Cuponea</h2>
            <div class="w-10 h-10 flex items-center justify-end">
                <span class="material-symbols-outlined text-2xl opacity-60">info</span>
            </div>
        </div>
        <div class="flex-1 flex flex-col justify-center px-6 py-4">
            <div class="mb-10 text-center relative">
                <div class="relative mx-auto w-28 h-28 mb-6">
                    <div class="absolute inset-0 bg-primary/20 rounded-3xl rotate-6"></div>
                    <div
                        class="absolute inset-0 bg-primary shadow-2xl shadow-primary/30 rounded-3xl flex items-center justify-center transform transition-transform hover:scale-105">
                        <div class="relative">
                            <span
                                class="material-symbols-outlined text-6xl text-[#102216] scale-110">shopping_bag</span>
                            <div
                                class="absolute -top-1 -right-1 bg-white dark:bg-background-dark rounded-full p-1 shadow-sm">
                                <span class="material-symbols-outlined text-primary text-xl fill-1">location_on</span>
                            </div>
                        </div>
                    </div>
                </div>
                <h1 class="text-3xl font-extrabold mb-2 tracking-tight">¡Hola de nuevo!</h1>
                <p class="text-[#61896f] dark:text-gray-400 text-sm font-medium">Ahorros inteligentes a la vuelta de la
                    esquina.</p>
            </div>
            <div class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-[#61896f] ml-1">Email</label>
                    <div class="group relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-4 text-[#61896f] group-focus-within:text-primary transition-colors">mail</span>
                        <input id="email"
                            class="w-full pl-12 pr-4 h-14 bg-white dark:bg-[#1a2e21]/50 border border-[#dbe6df] dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all shadow-sm"
                            placeholder="tu@email.com" type="email" />
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-[#61896f] ml-1">Contraseña</label>
                    <div class="group relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-4 text-[#61896f] group-focus-within:text-primary transition-colors">lock</span>
                        <input id="password"
                            class="w-full pl-12 pr-12 h-14 bg-white dark:bg-[#1a2e21]/50 border border-[#dbe6df] dark:border-white/10 rounded-2xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all shadow-sm"
                            placeholder="••••••••" type="password" />
                        <button class="absolute right-4 text-[#61896f] hover:text-primary transition-colors">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex justify-end">
                    <a class="text-xs font-bold text-primary-dark dark:text-primary hover:opacity-80 transition-opacity"
                        href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="pt-2">
                    <button onclick="handleLogin()"
                        class="group relative flex w-full items-center justify-center overflow-hidden rounded-2xl h-14 bg-primary text-[#102216] text-base font-extrabold transition-all hover:shadow-lg hover:shadow-primary/30 active:scale-[0.98]">
                        <span class="relative z-10 flex items-center gap-2">
                            Iniciar Sesión
                            <span
                                class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-1">arrow_forward</span>
                        </span>
                    </button>
                </div>
                <div id="error-message" class="text-red-500 text-sm text-center hidden"></div>

                <script src="../common/js/dataManager.js"></script>
                <script src="../common/js/auth.js"></script>
                <script>
                    function handleLogin() {
                        const email = document.getElementById('email').value;
                        const password = document.getElementById('password').value;
                        const errorEl = document.getElementById('error-message');

                        errorEl.classList.add('hidden');

                        if (!email || !password) {
                            errorEl.textContent = 'Por favor completa todos los campos';
                            errorEl.classList.remove('hidden');
                            return;
                        }

                        const result = Auth.login(email, password);
                        if (result.success) {
                            Auth.redirectBasedOnUser(result.user);
                        } else {
                            errorEl.textContent = result.message;
                            errorEl.classList.remove('hidden');
                        }
                    }
                </script>
                <div class="flex items-center py-2">
                    <div class="flex-1 h-[1px] bg-[#dbe6df] dark:bg-white/10"></div>
                    <span class="px-4 text-[#61896f] text-[10px] font-bold uppercase tracking-[0.2em]">o continúa
                        con</span>
                    <div class="flex-1 h-[1px] bg-[#dbe6df] dark:bg-white/10"></div>
                </div>
                <button
                    class="flex w-full items-center justify-center gap-3 rounded-2xl h-14 bg-white dark:bg-[#1a2e21]/30 border border-[#dbe6df] dark:border-white/10 text-[#111813] dark:text-white text-sm font-bold shadow-sm hover:bg-gray-50 dark:hover:bg-white/5 transition-all active:scale-[0.98]">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                            fill="#4285F4"></path>
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853"></path>
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05"></path>
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335"></path>
                    </svg>
                    <span>Google</span>
                </button>
            </div>
        </div>
        <div class="p-8 text-center mt-auto">
            <p class="text-[#61896f] dark:text-gray-400 text-sm font-medium">
                ¿No tienes cuenta?
                <a class="text-primary-dark dark:text-primary font-extrabold ml-1 hover:underline underline-offset-4"
                    href="#">Únete ahora</a>
            </p>
        </div>
        <div class="flex justify-center pb-2">
            <div class="w-32 h-1 bg-black/10 dark:bg-white/10 rounded-full"></div>
        </div>
    </div>

</body>

</html>
