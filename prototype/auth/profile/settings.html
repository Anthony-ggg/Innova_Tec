<!DOCTYPE html>
<html class="light" lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Ajustes - Local Savings</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13ec5b",
            "background-light": "#f6f8f6",
            "background-dark": "#102216",
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans"]
          },
          borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style type="text/tailwindcss">
    body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ios-switch:checked {
            background-color: #13ec5b;
        }
    </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-[#111813] dark:text-white transition-colors duration-300">
  <div
    class="max-w-md mx-auto min-h-screen shadow-2xl relative overflow-hidden flex flex-col bg-background-light dark:bg-background-dark">
    <div
      class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 pb-2 border-b border-gray-200 dark:border-gray-800">
      <button class="h-10 w-10 flex items-center justify-start text-[#111813] dark:text-white">
        <span class="material-symbols-outlined">arrow_back_ios</span>
      </button>
      <h2
        class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">
        Ajustes</h2>
    </div>
    <div class="flex-grow overflow-y-auto pb-8">
      <div class="mt-6">
        <p class="px-6 mb-2 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Cuenta</p>
        <div class="bg-white dark:bg-zinc-900 border-y border-gray-200 dark:border-gray-800">
          <button
            class="w-full flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800 last:border-0">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-gray-400">person</span>
              <span class="text-[15px] font-medium">Información del perfil</span>
            </div>
            <span class="material-symbols-outlined text-gray-300 text-xl">chevron_right</span>
          </button>
          <button
            class="w-full flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800 last:border-0">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-gray-400">lock</span>
              <span class="text-[15px] font-medium">Seguridad</span>
            </div>
            <span class="material-symbols-outlined text-gray-300 text-xl">chevron_right</span>
          </button>
        </div>
      </div>
      <div class="mt-8">
        <p class="px-6 mb-2 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Notificaciones
        </p>
        <div class="bg-white dark:bg-zinc-900 border-y border-gray-200 dark:border-gray-800">
          <div
            class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800 last:border-0">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-gray-400">notifications</span>
              <span class="text-[15px] font-medium">Notificaciones Push</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input checked="" class="sr-only peer" type="checkbox" />
              <div
                class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
              </div>
            </label>
          </div>
          <div
            class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800 last:border-0">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-gray-400">mail</span>
              <span class="text-[15px] font-medium">Email Marketing</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input class="sr-only peer" type="checkbox" />
              <div
                class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
              </div>
            </label>
          </div>
        </div>
      </div>
      <div class="mt-8">
        <p class="px-6 mb-2 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Privacidad</p>
        <div class="bg-white dark:bg-zinc-900 border-y border-gray-200 dark:border-gray-800">
          <button
            class="w-full flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800 last:border-0">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-gray-400">location_on</span>
              <span class="text-[15px] font-medium">Permisos de ubicación</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-sm text-gray-400">Al usar</span>
              <span class="material-symbols-outlined text-gray-300 text-xl">chevron_right</span>
            </div>
          </button>
        </div>
      </div>
      <div class="mt-8">
        <p class="px-6 mb-2 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Idioma</p>
        <div class="bg-white dark:bg-zinc-900 border-y border-gray-200 dark:border-gray-800">
          <button
            class="w-full flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-gray-800 last:border-0">
            <div class="flex items-center gap-3">
              <span class="material-symbols-outlined text-gray-400">language</span>
              <span class="text-[15px] font-medium">Seleccionar idioma</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-sm text-gray-400">Español</span>
              <span class="material-symbols-outlined text-gray-300 text-xl">chevron_right</span>
            </div>
          </button>
        </div>
      </div>
      <div class="mt-8 px-6">
        <button class="text-red-500 font-semibold text-[15px] flex items-center gap-2">
          <span class="material-symbols-outlined">logout</span>
          Cerrar sesión
        </button>
      </div>
      <div class="mt-12 px-6">
        <button
          class="w-full bg-[#111813] dark:bg-primary text-white dark:text-[#102216] h-14 rounded-2xl flex items-center justify-center gap-3 shadow-xl active:scale-95 transition-transform duration-100">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">storefront</span>
          <span class="text-base font-bold">Registrar mi negocio</span>
        </button>
        <p class="text-center text-xs text-gray-500 dark:text-gray-400 mt-3 px-4">
          ¿Eres comerciante? Únete a nuestra red y llega a más clientes.
        </p>
      </div>
    </div>
    <div
      class="h-20 flex items-center justify-around bg-white dark:bg-zinc-900 border-t border-gray-200 dark:border-gray-800 px-6">
      <button class="flex flex-col items-center gap-1 text-gray-400">
        <span class="material-symbols-outlined">explore</span>
        <span class="text-[10px] font-medium">Explorar</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-gray-400">
        <span class="material-symbols-outlined">location_on</span>
        <span class="text-[10px] font-medium">Cerca</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-primary">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
        <span class="text-[10px] font-medium">Perfil</span>
      </button>
    </div>
    <div class="flex justify-center pb-2 bg-white dark:bg-zinc-900">
      <div class="h-1 w-32 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
    </div>
  </div>

</body>

</html>
