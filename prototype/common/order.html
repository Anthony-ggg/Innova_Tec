<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "secondary-blue": "#2563eb",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <title>Confirmar Pedido</title>

</head>

<body
    class="bg-gray-50 dark:bg-black font-display text-[#111813] dark:text-white min-h-screen flex flex-col items-center justify-center">
    <div
        class="w-full max-w-md bg-background-light dark:bg-background-dark min-h-screen shadow-2xl relative flex flex-col">
        <!-- Top Navigation Bar -->
        <header
            class="sticky top-0 z-50 bg-white dark:bg-background-dark/95 backdrop-blur-sm border-b border-gray-100 dark:border-gray-800">
            <div class="flex items-center px-4 py-4 justify-between">
                <div
                    class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <span class="material-symbols-outlined text-[#111813] dark:text-white">arrow_back_ios_new</span>
                </div>
                <h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center">Confirmar Pedido</h2>
                <div class="size-10"></div> <!-- Spacer for symmetry -->
            </div>
        </header>
        <main class="flex-1 pb-40">
            <!-- Section: Items & Stores -->
            <div class="px-4">
                <h3 class="text-lg font-bold leading-tight tracking-tight py-4">Resumen del Pedido</h3>
                <div id="order-items" class="flex flex-col gap-3">
                    <!-- Dynamic Item -->
                    <div class="animate-pulse bg-gray-100 h-24 rounded-xl"></div>
                </div>
            </div>
            <!-- Section: Savings Card -->
            <div id="savings-section" class="p-4 hidden">
                <div class="relative overflow-hidden bg-primary rounded-xl p-4 text-white shadow-lg shadow-primary/20">
                    <div class="absolute right-[-10%] top-[-20%] size-32 bg-white/10 rounded-full blur-2xl"></div>
                    <div class="absolute left-[-10%] bottom-[-20%] size-32 bg-white/10 rounded-full blur-2xl"></div>
                    <div class="relative flex items-center justify-between gap-4">
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-1 opacity-90">
                                <span class="material-symbols-outlined text-sm">confirmation_number</span>
                                <p class="text-xs font-semibold uppercase tracking-wider">Cupones Aplicados</p>
                            </div>
                            <p id="savings-amount" class="text-2xl font-bold leading-tight">-$0.00</p>
                            <p class="text-sm opacity-90 font-medium">Ahorros totales</p>
                        </div>
                        <div class="flex items-center justify-center bg-white/20 size-14 rounded-full backdrop-blur-md">
                            <span class="material-symbols-outlined text-3xl">redeem</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Section: Price Breakdown -->
            <div class="px-4 py-4 space-y-3">
                <div class="flex justify-between items-center text-gray-500 dark:text-gray-400">
                    <p class="text-base font-medium">Subtotal</p>
                    <p id="subtotal-price" class="text-base font-medium">--</p>
                </div>
                <div class="flex justify-between items-center text-primary">
                    <p class="text-base font-medium">Descuento</p>
                    <p id="discount-price" class="text-base font-medium">--</p>
                </div>
                <div
                    class="pt-4 border-t border-dashed border-gray-200 dark:border-gray-700 flex justify-between items-end">
                    <div>
                        <p class="text-sm font-medium text-gray-500 dark:text-gray-400">Total Final</p>
                        <p id="total-price"
                            class="text-4xl font-extrabold text-[#111813] dark:text-white tracking-tight">--</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-gray-400">IVA incluido</p>
                    </div>
                </div>
            </div>
        </main>
        <!-- Bottom Actions - Fixed to Bottom -->
        <footer
            class="fixed bottom-0 w-full max-w-md mx-auto bg-white dark:bg-background-dark p-4 pb-8 border-t border-gray-100 dark:border-gray-800 shadow-[0_-4px_20px_0_rgba(0,0,0,0.05)] z-40">
            <div class="flex flex-col gap-3 max-w-md mx-auto">
                <button onclick="processPayment()"
                    class="w-full bg-secondary-blue hover:bg-blue-700 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                    <span class="material-symbols-outlined">payments</span>
                    <span>CONFIRMAR Y PAGAR</span>
                </button>
            </div>
        </footer>
    </div>

    <script src="js/dataManager.js"></script>
    <script>
        let currentCoupon = null;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const couponId = urlParams.get('couponId');

            if (!couponId) {
                alert('No se especificó un cupón');
                window.history.back();
                return;
            }

            currentCoupon = DataManager.getCouponById(couponId);

            if (!currentCoupon) {
                alert('Cupón no encontrado');
                window.history.back();
                return;
            }

            renderOrder();
        });

        function renderOrder() {
            const container = document.getElementById('order-items');

            // Calculate prices
            const originalPrice = currentCoupon.price;
            // Assuming '100% OFF' string or '50%' etc. parsing simple logic or hardcoded mock
            // For prototype simplicy, adding a 'finalPrice' or calculating
            let finalPrice = currentCoupon.finalPrice;
            if (finalPrice === undefined) {
                // Parse discount string simple
                if (currentCoupon.discount.includes('100%')) finalPrice = 0;
                else if (currentCoupon.discount.includes('50%')) finalPrice = originalPrice / 2;
                else if (currentCoupon.discount.includes('30%')) finalPrice = originalPrice * 0.7;
                else finalPrice = originalPrice; // Fallback
            }

            const savings = originalPrice - finalPrice;

            // Render Item
            container.innerHTML = `
                 <div class="bg-white dark:bg-gray-900 rounded-xl p-3 shadow-sm border border-gray-50 dark:border-gray-800">
                    <div class="flex items-center gap-4">
                        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-16"
                            style='background-image: url("${currentCoupon.image}");'>
                        </div>
                        <div class="flex flex-col flex-1 justify-center">
                            <p class="text-[#111813] dark:text-white text-base font-semibold leading-normal line-clamp-1">
                                ${currentCoupon.title}
                            </p>
                            <div class="flex items-center gap-1">
                                <span class="material-symbols-outlined text-xs text-primary">storefront</span>
                                <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Cafetería Central</p>
                            </div>
                        </div>
                        <div class="shrink-0 text-right">
                             ${originalPrice > finalPrice ? `<p class="text-gray-400 line-through text-xs">$${originalPrice.toFixed(2)}</p>` : ''}
                            <p class="text-[#111813] dark:text-white text-base font-bold">$${finalPrice.toFixed(2)}</p>
                        </div>
                    </div>
                </div>
            `;

            // Update Breakdown
            document.getElementById('subtotal-price').textContent = `$${originalPrice.toFixed(2)}`;
            document.getElementById('discount-price').textContent = `-$${savings.toFixed(2)}`;
            document.getElementById('total-price').textContent = `$${finalPrice.toFixed(2)}`;

            if (savings > 0) {
                document.getElementById('savings-section').classList.remove('hidden');
                document.getElementById('savings-amount').textContent = `-$${savings.toFixed(2)}`;
            }
        }

        function processPayment() {
            const user = DataManager.getSession();
            if (!user) {
                alert('Debes iniciar sesión para comprar');
                window.location.href = '../auth/singIn.html';
                return;
            }

            // Create Order
            DataManager.createOrder({
                userId: user.id,
                couponId: currentCoupon.id,
                total: parseFloat(document.getElementById('total-price').textContent.replace('$', '')),
                items: [currentCoupon]
            });

            alert('¡Pedido realizado con éxito!');
            window.location.href = '../users/notifications_list.html';
        }
    </script>

</html>
