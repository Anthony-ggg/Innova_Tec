<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Perfil de Usuario - Local Savings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

</head>

<body class="bg-background-light dark:bg-background-dark text-[#111813] dark:text-white transition-colors duration-300">
    <!-- Screen Container (iOS Form Factor Simulation) -->
    <div
        class="w-full max-w-4xl mx-auto min-h-screen shadow-2xl relative overflow-hidden flex flex-col bg-background-light dark:bg-background-dark">
        <!-- TopAppBar with Settings Gear -->
        <div
            class="sticky top-0 z-10 flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-gray-200 dark:border-gray-800">
            <h2 class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1">Perfil
            </h2>
            <div class="flex items-center justify-end">
                <button
                    class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-full bg-white dark:bg-zinc-800 shadow-sm text-[#111813] dark:text-white">
                    <span class="material-symbols-outlined">settings</span>
                </button>
            </div>
        </div>
        <!-- Profile Header Section -->
        <div class="flex p-4 mt-4 @container">
            <div class="flex w-full flex-col gap-4 items-center">
                <div class="flex gap-4 flex-col items-center">
                    <div class="relative">
                        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full min-h-32 w-32 border-4 border-primary/20 shadow-lg"
                            data-alt="User profile portrait smiling friendly face"
                            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDa7fW5ppuwJ-9OuzFdetqnBURg7M475Q6R2cTipJg1Ch-pIpP13YN98j6kyhFW2rIJAPVpKTV2Vg8j5j8LXT7lhEK2MQnx5oOndJe5zutE9qIer63y3ePz7E9bx-ywx56lqRTFoEHA98rncAMAbfUj7R0aIVdx1BH34AgzWkAFIhnqpwBk_jQj_9cT0Mu3Ge5_80kRYlV43DoSBnk_3hWZYkqo0CN_BXqtwzvBfE1u04Cikt41OHJ915tpyG_Pgi-vsiDf16s542yg");'>
                        </div>
                        <div
                            class="absolute bottom-1 right-1 bg-primary rounded-full p-1.5 border-4 border-white dark:border-background-dark">
                            <span class="material-symbols-outlined text-[16px] text-white font-bold">verified</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-center justify-center">
                        <p
                            class="text-[#111813] dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] text-center">
                            Hola, Alejandro</p>
                        <p class="text-[#61896f] dark:text-primary/70 text-base font-medium leading-normal text-center">
                            Miembro desde 2023</p>
                    </div>
                </div>
                <div class="px-5 pt-2 pb-6 space-y-6 flex-1 overflow-y-auto pb-32">
                    <!-- Profile Header -->
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <div class="size-20 rounded-full bg-gradient-to-tr from-primary to-emerald-400 p-[2px]">
                                <div class="size-full rounded-full bg-white dark:bg-background-dark p-1">
                                    <img src="https://ui-avatars.com/api/?name=User&background=random" id="profile-img"
                                        class="size-full rounded-full object-cover">
                                </div>
                            </div>
                            <div
                                class="absolute bottom-1 right-1 size-6 bg-primary rounded-full border-[3px] border-white dark:border-background-dark flex items-center justify-center text-white text-[10px]">
                                <span class="material-symbols-outlined text-xs">edit</span>
                            </div>
                        </div>
                        <div>
                            <h2 id="user-name"
                                class="text-xl font-extrabold text-[#111813] dark:text-white leading-tight">Cargando...
                            </h2>
                            <p id="user-email" class="text-sm font-medium text-gray-500 dark:text-gray-400">...</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span
                                    class="bg-primary/10 text-primary text-[10px] font-bold px-2 py-0.5 rounded-full border border-primary/20 uppercase tracking-wider"
                                    id="user-role">MEMBER</span>
                            </div>
                        </div>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid grid-cols-2 gap-3">
                        <div
                            class="bg-white dark:bg-[#121813] p-4 rounded-2xl border border-gray-100 dark:border-white/5 shadow-sm">
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Ahorro Total</p>
                            <p class="text-2xl font-black text-[#111813] dark:text-white">$0.00</p> <!-- Mock -->
                        </div>
                        <div
                            class="bg-white dark:bg-[#121813] p-4 rounded-2xl border border-gray-100 dark:border-white/5 shadow-sm">
                            <p class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-1">Cupones Usados</p>
                            <p class="text-2xl font-black text-primary">0</p> <!-- Mock -->
                        </div>
                    </div>

                    <!-- Settings List -->
                    <div class="space-y-2">
                        <h3 class="text-sm font-bold text-gray-900 dark:text-white px-1">Cuenta</h3>
                        <div
                            class="bg-white dark:bg-[#121813] rounded-2xl border border-gray-100 dark:border-white/5 overflow-hidden">
                            <button
                                class="w-full flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors border-b border-gray-100 dark:border-white/5">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="size-8 rounded-full bg-blue-50 dark:bg-blue-500/10 flex items-center justify-center text-blue-500">
                                        <span class="material-symbols-outlined text-lg">person</span>
                                    </div>
                                    <span class="font-bold text-[#111813] dark:text-white">Datos Personales</span>
                                </div>
                                <span class="material-symbols-outlined text-gray-400">chevron_right</span>
                            </button>
                            <!-- Switch Role Button (Only for Owner/Admin) -->
                            <button id="switch-role-btn"
                                class="w-full flex items-center justify-between p-4 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors border-b border-gray-100 dark:border-white/5 hidden">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="size-8 rounded-full bg-purple-50 dark:bg-purple-500/10 flex items-center justify-center text-purple-500">
                                        <span class="material-symbols-outlined text-lg">swap_horiz</span>
                                    </div>
                                    <span class="font-bold text-[#111813] dark:text-white">Cambiar Modo</span>
                                </div>
                                <span class="material-symbols-outlined text-gray-400">chevron_right</span>
                            </button>
                            <button onclick="Auth.logout()"
                                class="w-full flex items-center justify-between p-4 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors group">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="size-8 rounded-full bg-red-50 dark:bg-red-500/10 flex items-center justify-center text-red-500 group-hover:bg-red-100 dark:group-hover:bg-red-500/20 transition-colors">
                                        <span class="material-symbols-outlined text-lg">logout</span>
                                    </div>
                                    <span class="font-bold text-red-500">Cerrar Sesión</span>
                                </div>
                            </button>
                        </div>
                    </div>

                    <p class="text-center text-xs text-gray-400 font-medium pt-4">Versión 1.0.0 (Prototype)</p>
                </div>

                <div id="bottom-nav-container"></div>
            </div>

            <script src="../../common/js/dataManager.js"></script>
            <script src="../../common/js/auth.js"></script>
            <script src="../../components/js/bottom_navigation.js"></script>
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    if (typeof loadBottomNav === 'function') {
                        loadBottomNav("profile");
                    }

                    const user = DataManager.getSession();
                    if (user) {
                        document.getElementById('user-name').textContent = user.name;
                        document.getElementById('user-email').textContent = user.email;
                        document.getElementById('user-role').textContent = user.role.toUpperCase();
                        document.getElementById('profile-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=13ec5b&color=fff`;

                        // Show switch button if owner or admin
                        if (user.role === 'admin' || user.role === 'owner') {
                            // Logic for switching? For now, button just exists but we can make it redirect to opposite Landing
                            // But wait, "Switch Mode" usually implies changing the View context while keeping same user.
                            // For prototype, let's just make it redirect to the "Other" landing page.
                            const btn = document.getElementById('switch-role-btn');
                            btn.classList.remove('hidden');
                            btn.onclick = () => {
                                if (confirm('¿Ir al panel de gestión?')) {
                                    Auth.redirectBasedOnUser(user); // Reprocess redirect logic
                                    // Actually, Auth.redirectBasedOnUser sends them to their MAIN role landing.
                                    // If they are currently IN their main role landing, they might want to see CLIENT view.
                                    // Implementing simple toggle is complex without state.
                                    // Let's just alert "Feature Coming Soon"
                                    alert('Cambio de vista (Cliente <-> Gestión) próximamente.');
                                }
                            }
                        }
                    } else {
                        window.location.href = '../../auth/singIn.html';
                    }
                });
            </script>
</body>

</html>
