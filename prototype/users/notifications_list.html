<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Alerts &amp; Notifications Center</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen font-display transition-colors duration-300">
    <div
        class="w-full max-w-3xl mx-auto bg-white dark:bg-zinc-900 min-h-screen shadow-xl flex flex-col relative overflow-hidden">
        <!-- TopAppBar -->
        <header
            class="sticky top-0 z-20 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-zinc-100 dark:border-zinc-800">
            <div class="flex items-center p-4 pb-3 justify-between">
                <h1 class="text-[#111813] dark:text-white text-xl font-bold leading-tight tracking-tight">Notificaciones
                </h1>
                <button
                    class="text-primary text-sm font-bold leading-normal tracking-wide hover:opacity-80 transition-opacity">
                    Marcar como leídas
                </button>
            </div>
        </header>
        <main class="flex-1 pb-24">
            <!-- Section: Hoy -->
            <section>
                <div class="flex items-center px-4 pb-2 pt-6">
                    <h3 class="text-[#111813] dark:text-zinc-200 text-lg font-bold leading-tight tracking-tight">Hoy
                    </h3>
                </div>
                <!-- ListItem: Nuevo Cupón (Pizzería Roma) -->
                <div
                    class="group relative flex gap-4 bg-white dark:bg-zinc-900 px-4 py-4 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-colors border-b border-zinc-50 dark:border-zinc-800">
                    <div class="flex items-start gap-4 flex-1">
                        <div
                            class="text-primary flex items-center justify-center rounded-xl bg-primary/10 shrink-0 size-12">
                            <span class="material-symbols-outlined text-2xl">local_offer</span>
                        </div>
                        <div class="flex flex-1 flex-col justify-center">
                            <div class="flex items-center gap-2 mb-0.5">
                                <p class="text-[#111813] dark:text-white text-base font-bold leading-normal">¡Nuevo
                                    Cupón!</p>
                                <span
                                    class="bg-primary/20 text-[#078829] dark:text-primary text-[10px] px-1.5 py-0.5 rounded-full font-bold uppercase tracking-wider">Ahorro</span>
                            </div>
                            <p class="text-zinc-500 dark:text-zinc-400 text-xs font-medium leading-normal mb-1">Hace 2
                                min • Pizzería Roma</p>
                            <p class="text-zinc-600 dark:text-zinc-400 text-sm font-normal leading-relaxed">Obtén 20% de
                                descuento en tu próxima pizza familiar.</p>
                        </div>
                    </div>
                    <div class="shrink-0 pt-1">
                        <div class="flex size-7 items-center justify-center">
                            <div class="size-2.5 rounded-full bg-primary shadow-[0_0_8px_rgba(19,236,91,0.6)]"></div>
                        </div>
                    </div>
                </div>
                <!-- ListItem: Negocio Verificado (Blue Alert) -->
                <div
                    class="group relative flex gap-4 bg-white dark:bg-zinc-900 px-4 py-4 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-colors border-b border-zinc-50 dark:border-zinc-800">
                    <div class="flex items-start gap-4 flex-1">
                        <div
                            class="text-blue-500 flex items-center justify-center rounded-xl bg-blue-50 dark:bg-blue-900/20 shrink-0 size-12">
                            <span class="material-symbols-outlined text-2xl">verified_user</span>
                        </div>
                        <div class="flex flex-1 flex-col justify-center">
                            <p class="text-[#111813] dark:text-white text-base font-bold leading-normal mb-0.5">Negocio
                                Verificado</p>
                            <p class="text-zinc-500 dark:text-zinc-400 text-xs font-medium leading-normal mb-1">Hace 1h
                            </p>
                            <p class="text-zinc-600 dark:text-zinc-400 text-sm font-normal leading-relaxed">Tu perfil de
                                negocio ha sido validado exitosamente. Ahora eres un comercio certificado.</p>
                        </div>
                    </div>
                    <!-- Read state (no dot) -->
                    <div class="shrink-0 pt-1 w-7"></div>
                </div>
            </section>
            <!-- Section: Esta semana -->
            <section>
                <div class="flex items-center px-4 pb-2 pt-8">
                    <h3 class="text-[#111813] dark:text-zinc-200 text-lg font-bold leading-tight tracking-tight">Esta
                        semana</h3>
                </div>
                <!-- ListItem: Oferta Relámpago -->
                <div
                    class="group relative flex gap-4 bg-white dark:bg-zinc-900 px-4 py-4 hover:bg-zinc-50 dark:hover:bg-zinc-800/50 transition-colors border-b border-zinc-50 dark:border-zinc-800">
                    <div class="px-5 pt-6 flex-1 overflow-y-auto pb-32" id="notifications-container">
                        <!-- Dynamic Content -->
                        <div
                            class="animate-pulse flex gap-4 p-4 rounded-2xl bg-white dark:bg-[#121813] border border-gray-100 dark:border-white/5">
                            <div class="size-12 rounded-full bg-gray-200 dark:bg-white/10"></div>
                            <div class="flex-1 space-y-2">
                                <div class="h-4 bg-gray-200 dark:bg-white/10 rounded w-3/4"></div>
                                <div class="h-3 bg-gray-200 dark:bg-white/10 rounded w-1/2"></div>
                            </div>
                        </div>
                    </div>
            </section>
        </main>
        <!-- Bottom Navigation -->
        <div id="bottom-nav-container"></div>

    </div>
    <!-- Componentes -->
    <!-- Not module (async defer) to support file:// protocol -->
    <script src="../../common/js/dataManager.js"></script>
    <script src="../components/js/bottom_navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadBottomNav === 'function') {
                loadBottomNav("alerts");
            }

            const user = DataManager.getSession();
            const container = document.getElementById('notifications-container');

            if (!user) {
                container.innerHTML = `<div class="p-6 text-center text-gray-500">Inicia sesión para ver tus notificaciones</div>`;
                return;
            }

            const orders = DataManager.getOrdersByUser(user.id);

            if (orders.length === 0) {
                container.innerHTML = `
                   <div class="flex flex-col items-center justify-center h-full text-center py-20 opacity-60">
                        <span class="material-symbols-outlined text-6xl mb-4 text-gray-300">notifications_off</span>
                        <p class="text-lg font-bold">Sin notificaciones</p>
                        <p class="text-sm">Tus compras y alertas aparecerán aquí.</p>
                   </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => {
                const item = order.items[0]; // Assuming single item per order for now
                return `
                <div class="flex gap-4 p-4 mb-3 rounded-2xl bg-white dark:bg-[#121813] border border-gray-100 dark:border-white/5 relative overflow-hidden group">
                    <div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative z-10 size-12 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined text-primary text-2xl">shopping_bag</span>
                    </div>
                    <div class="relative z-10 flex-1">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="text-base font-bold text-[#111813] dark:text-white leading-tight">Compra Exitosa</h3>
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${new Date(order.createdAt).toLocaleDateString()}</span>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 font-medium leading-normal mb-2">
                            Has comprado el cupón <b class="text-[#111813] dark:text-white">${item.title}</b> por <span class="text-primary font-bold">$${order.total.toFixed(2)}</span>.
                        </p>
                        <div class="flex items-center gap-2">
                             <div class="bg-primary/20 text-primary px-2 py-0.5 rounded-lg text-[10px] font-black uppercase tracking-wider">
                                Order #${order.id.split('-').pop()}
                             </div>
                             <span class="text-green-500 text-xs font-bold flex items-center gap-0.5">
                                <span class="material-symbols-outlined text-sm">check_circle</span> Completado
                             </span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        });
    </script>
</body>

</html>
