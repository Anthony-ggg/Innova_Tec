<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Main Map Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .filled-icon {
            font-variation-settings: 'FILL' 1;
        }
    </style>

</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
    <div
        class="relative w-full h-[100dvh] flex flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
        <!-- Top App Bar / Search Area -->
        <div class="absolute top-0 z-20 w-full max-w-md left-1/2 -translate-x-1/2 px-4 pt-6">
            <div class="flex items-center gap-2">
                <div
                    class="flex flex-1 items-center bg-white/95 dark:bg-background-dark/95 backdrop-blur-md rounded-xl h-12 shadow-lg border border-slate-200/50 dark:border-slate-800/50 px-3">
                    <span class="material-symbols-outlined text-slate-400">search</span>
                    <input
                        class="flex-1 border-none bg-transparent focus:ring-0 text-sm font-medium placeholder:text-slate-400"
                        placeholder="Search for pizza, shopping..." type="text" />
                </div>
                <button
                    class="flex h-12 w-12 items-center justify-center bg-white/95 dark:bg-background-dark/95 backdrop-blur-md rounded-xl shadow-lg border border-slate-200/50 dark:border-slate-800/50">
                    <span class="material-symbols-outlined text-slate-700 dark:text-slate-200">tune</span>
                </button>
            </div>
            <!-- Chips Container -->
            <div class="mt-3 flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                <div class="flex h-9 shrink-0 items-center gap-2 rounded-full bg-primary px-4 shadow-sm">
                    <span class="material-symbols-outlined text-sm font-bold">restaurant</span>
                    <p class="text-xs font-bold">Food</p>
                </div>
                <div
                    class="flex h-9 shrink-0 items-center gap-2 rounded-full bg-white dark:bg-slate-800 px-4 shadow-sm border border-slate-200 dark:border-slate-700">
                    <span class="material-symbols-outlined text-sm">shopping_bag</span>
                    <p class="text-xs font-semibold">Retail</p>
                </div>
                <div
                    class="flex h-9 shrink-0 items-center gap-2 rounded-full bg-white dark:bg-slate-800 px-4 shadow-sm border border-slate-200 dark:border-slate-700">
                    <span class="material-symbols-outlined text-sm">local_gas_station</span>
                    <p class="text-xs font-semibold">Gas</p>
                </div>
            </div>
        </div>
        <!-- Main Map Area -->
        <div class="relative flex-1">
            <div class="h-full w-full bg-cover bg-center"
                data-alt="Interactive city map with navigation markers and street details" data-location="Rome, Italy"
                style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDNQN7xI6NxBMzSTAs6YCrhzSlA-3hIqi9chgDHEGqf400uZ34g6VtDWTBeaS3UbLHYH_vTdJZn-9rbTDjHgUMhUS0JRspSnyRE4Ngxse63k3P76YXGFpG1VuTrxH8AEekHoMFc6z-JKdxK2mQ1uaGblsgO5GXZkq2WcACetHeRqsbDB1RXlRek5Jk-jUagJXoMFw_4135vIs3aQ-HJHZ70TYL01GY-lLQaKHqEp2Iy0ikJ8W2HPCyRJnHxW9aAkYAhJl2VvGls4f72');">
                <!-- Simulated Markers -->
                <div class="absolute left-1/4 top-1/3">
                    <div class="flex flex-col items-center">
                        <div
                            class="flex h-10 w-10 items-center justify-center rounded-full bg-white dark:bg-slate-800 shadow-xl border-2 border-primary">
                            <span class="material-symbols-outlined text-primary filled-icon">restaurant</span>
                        </div>
                        <div class="h-2 w-0.5 bg-primary"></div>
                    </div>
                </div>
                <div class="absolute right-1/3 top-1/2">
                    <div class="flex flex-col items-center">
                        <div
                            class="flex h-10 w-10 items-center justify-center rounded-full bg-white dark:bg-slate-800 shadow-xl border-2 border-slate-400">
                            <span
                                class="material-symbols-outlined text-slate-600 dark:text-slate-300">shopping_bag</span>
                        </div>
                        <div class="h-2 w-0.5 bg-slate-400"></div>
                    </div>
                </div>
                <!-- User Location Marker -->
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2">
                    <div class="relative flex h-8 w-8 items-center justify-center rounded-full bg-primary/30">
                        <div class="h-4 w-4 rounded-full bg-primary border-2 border-white"></div>
                    </div>
                </div>
                <!-- Map Controls -->
                <div class="absolute right-4 bottom-48 flex flex-col gap-2">
                    <div
                        class="flex flex-col overflow-hidden rounded-xl bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700">
                        <button
                            class="flex h-10 w-10 items-center justify-center border-b border-slate-100 dark:border-slate-700">
                            <span class="material-symbols-outlined text-slate-600 dark:text-slate-300">add</span>
                        </button>
                        <button class="flex h-10 w-10 items-center justify-center">
                            <span class="material-symbols-outlined text-slate-600 dark:text-slate-300">remove</span>
                        </button>
                    </div>
                    <button
                        class="flex h-10 w-10 items-center justify-center rounded-xl bg-white dark:bg-slate-800 shadow-lg border border-slate-200 dark:border-slate-700">
                        <span class="material-symbols-outlined text-primary filled-icon">near_me</span>
                    </button>
                </div>
            </div>
        </div>
        <!-- Quick View Card (Floating) -->
        <div class="absolute bottom-20 z-20 w-full max-w-md left-1/2 -translate-x-1/2 px-4">
            <div
                class="flex items-stretch gap-4 rounded-2xl bg-white dark:bg-slate-800 p-4 shadow-2xl ring-1 ring-black/5 dark:ring-white/10">
                <div class="flex flex-[2_2_0px] flex-col justify-between py-1">
                    <div class="flex flex-col gap-1">
                        <span
                            class="w-fit rounded-lg bg-primary/20 px-2 py-0.5 text-[10px] font-bold tracking-wider text-green-700 dark:text-primary uppercase">20%
                            OFF</span>
                        <h3 class="text-lg font-bold leading-tight text-slate-900 dark:text-white">Pizzería Roma</h3>
                        <div class="flex items-center gap-1 text-slate-500 dark:text-slate-400">
                            <span class="material-symbols-outlined text-sm">location_on</span>
                            <p class="text-xs font-medium">300m away</p>
                        </div>
                    </div>
                    <button
                        class="mt-3 flex items-center justify-center gap-2 rounded-xl bg-primary px-4 py-2 text-sm font-bold text-slate-900 shadow-sm transition-transform active:scale-95">
                        <span class="material-symbols-outlined text-lg">confirmation_number</span>
                        <span>Get Coupon</span>
                    </button>
                </div>
                <div class="h-28 w-28 shrink-0 overflow-hidden rounded-xl bg-slate-100 dark:bg-slate-700">
                    <div class="h-full w-full bg-cover bg-center"
                        data-alt="Gourmet italian pizza with fresh basil and mozzarella"
                        style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA1hSFxsKrkSvNqyBBzgQgyu_J8kXWho2ctHF37cE368gKEB-tDSkaYhO49kMVuBtQvaj_Zjmxx5WlAKtKhetU3lE0bFTTVuEY2QIa3j9OwHBgIlsiWoofCo6iawDmBTtjkLtUe6PBNiOpcR0-g5_P6da82s8MC8F76kW-tLqtzGZx-TX06NAqdu-Ge_3pHqpEwgeK4Ix4zOXu5xOZU5u9ll3I-FWKOWfLXGc2b0Dk9Wu7IK5ZwIWHiJ0hxQEqh_I_DY_6La1hSH6KQ');">
                    </div>
                </div>
            </div>
        </div>
        <!-- Bottom Navigation Bar -->
        <div id="bottom-nav-container"></div>

    </div>
    <!-- Componentes -->
    <!-- Not module (async defer) to support file:// protocol -->
    <script src="../components/js/bottom_navigation.js"></script>
    <script>
        // Wait for script to load then run
        window.addEventListener('load', function () {
            if (typeof loadBottomNav === 'function') {
                loadBottomNav("map");
            } else {
                console.error("loadBottomNav function not found. Check path to script.");
            }
        });
    </script>

    <style>
        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</body>

</html>
