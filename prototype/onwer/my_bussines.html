<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <title>Mis Negocios</title>

</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#111813] dark:text-white transition-colors duration-300">
    <div
        class="relative flex h-screen w-full flex-col overflow-hidden max-w-md mx-auto bg-white dark:bg-[#0c1a10] shadow-2xl">
        <!-- TopAppBar -->
        <header
            class="flex items-center bg-white dark:bg-[#0c1a10] px-4 py-4 justify-between border-b border-gray-100 dark:border-gray-800">
            <div
                class="text-[#111813] dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
                <span class="material-symbols-outlined">arrow_back_ios_new</span>
            </div>
            <h2
                class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">
                Mis Negocios</h2>
        </header>
        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto px-4 py-6 space-y-4" id="business-list">
            <!-- Dynamic Content -->
            <div
                class="animate-pulse flex flex-col gap-3 bg-white dark:bg-[#14291b] p-4 rounded-xl shadow-sm border border-gray-50 dark:border-gray-800">
                <div class="h-14 bg-gray-200 dark:bg-white/10 rounded-lg"></div>
            </div>
        </main>
        <!-- Floating Action Button (FAB) -->
        <div class="absolute bottom-24 right-6 z-10">
            <button onclick="window.location.href='request_bussines.html'"
                class="flex size-16 cursor-pointer items-center justify-center rounded-full bg-primary text-[#111813] shadow-lg hover:brightness-95 active:scale-95 transition-all">
                <span class="material-symbols-outlined text-[32px] font-bold">add</span>
            </button>
        </div>
        <!-- Bottom Tab Bar -->
        <div id="bottom-nav-container"></div>
    </div>

    <script src="../../common/js/dataManager.js"></script>
    <script src="../../common/js/auth.js"></script>
    <script src="../../components/js/bottom_navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadBottomNav === 'function') {
                loadBottomNav("store");
            }

            const user = DataManager.getSession();
            if (!user || user.role !== 'owner') {
                // Redirect if not owner? Or just show empty. 
                // For prototype, better to redirect or show alert.
                // but allows multi-role, so maybe just check session.
            }

            const container = document.getElementById('business-list');
            const businesses = DataManager.getBusinessesByOwner(user.id);

            if (businesses.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-center opacity-60">
                         <span class="material-symbols-outlined text-4xl mb-2">storefront</span>
                         <p>No tienes negocios registrados.</p>
                         <p class="text-sm">Toca el botón + para empezar.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = businesses.map(bus => {
                let statusBadge = '';
                let statusText = '';

                if (bus.status === 'verified' || bus.status === 'active') {
                    statusBadge = `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-primary/20 text-[#078829] dark:text-primary">ACTIVO</span>`;
                    statusText = 'Publicado';
                } else if (bus.status === 'rejected') {
                    statusBadge = `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400">RECHAZADO</span>`;
                    statusText = 'Rechazado';
                } else {
                    statusBadge = `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400">PENDIENTE</span>`;
                    statusText = 'En revisión';
                }

                return `
                <div class="flex flex-col gap-3 bg-white dark:bg-[#14291b] p-4 rounded-xl shadow-sm border border-gray-50 dark:border-gray-800" onclick="window.location.href='../users/bussines/pizza.html?id=${bus.id}'"> <!-- Placeholder link -->
                    <div class="flex items-center gap-4 justify-between">
                        <div class="flex items-center gap-4">
                            <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-lg size-14 shadow-inner"
                                style='background-image: url("${bus.image || 'https://via.placeholder.com/150'}");'>
                            </div>
                            <div class="flex flex-col justify-center">
                                <p class="text-[#111813] dark:text-white text-base font-semibold leading-normal line-clamp-1">${bus.name}</p>
                                <p class="text-[#61896f] dark:text-[#a0c4ae] text-sm font-normal">${statusText}</p>
                            </div>
                        </div>
                        <div class="shrink-0">
                            ${statusBadge}
                        </div>
                    </div>
                    ${bus.status === 'rejected' ? `
                    <div class="flex justify-between items-center mt-1 pt-2 border-t border-gray-50 dark:border-gray-800/50">
                        <p class="text-xs text-[#61896f] dark:text-[#a0c4ae]">Motivo: Documentación incompleta</p>
                    </div>` : ''}
                </div>
                `;
            }).join('');
        });
    </script>
    </div>
</body>

</html>
