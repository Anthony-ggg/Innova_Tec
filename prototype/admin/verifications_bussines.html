<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Admin Business Verification List</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen text-[#111813] dark:text-white">
    <!-- Top Navigation Bar -->
    <div class="sticky top-0 z-50 bg-white dark:bg-[#1a2e1f] border-b border-[#dbe6df] dark:border-[#2a3d31]">
        <div class="flex items-center p-4 justify-between max-w-xl mx-auto">
            <div
                class="text-[#111813] dark:text-white flex size-10 shrink-0 items-center justify-center cursor-pointer">
                <span class="material-symbols-outlined">arrow_back_ios</span>
            </div>
            <h1
                class="text-[#111813] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">
                Verificaciones</h1>
            <div class="size-10 flex items-center justify-center">
                <span class="material-symbols-outlined">tune</span>
            </div>
        </div>
    </div>
    <div class="max-w-xl mx-auto pb-20">
        <!-- Search Section -->
        <div class="px-4 py-4 bg-white dark:bg-[#1a2e1f]">
            <label class="flex flex-col min-w-40 h-12 w-full">
                <div class="flex w-full flex-1 items-stretch rounded-xl h-full shadow-sm">
                    <div class="text-[#61896f] flex border-none bg-[#f0f4f2] dark:bg-[#25382b] items-center justify-center pl-4 rounded-l-xl"
                        data-icon="MagnifyingGlass">
                        <span class="material-symbols-outlined">search</span>
                    </div>
                    <input
                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-r-xl text-[#111813] dark:text-white focus:outline-0 focus:ring-0 border-none bg-[#f0f4f2] dark:bg-[#25382b] h-full placeholder:text-[#61896f] px-4 pl-2 text-base font-normal"
                        placeholder="Buscar por nombre o RUC" value="" />
                </div>
            </label>
        </div>
        <!-- Filter Tabs -->
        <div class="sticky top-[73px] z-40 bg-white dark:bg-[#1a2e1f] pb-1 shadow-sm">
            <div class="flex border-b border-[#dbe6df] dark:border-[#2a3d31] px-4 justify-between">
                <a class="flex flex-col items-center justify-center border-b-[3px] border-b-primary text-[#111813] dark:text-white pb-[13px] pt-4 flex-1"
                    href="#">
                    <p class="text-sm font-bold leading-normal tracking-[0.015em]">Pendientes</p>
                </a>
                <a class="flex flex-col items-center justify-center border-b-[3px] border-b-transparent text-[#61896f] pb-[13px] pt-4 flex-1"
                    href="#">
                    <p class="text-sm font-bold leading-normal tracking-[0.015em]">Activos</p>
                </a>
                <a class="flex flex-col items-center justify-center border-b-[3px] border-b-transparent text-[#61896f] pb-[13px] pt-4 flex-1"
                    href="#">
                    <p class="text-sm font-bold leading-normal tracking-[0.015em]">Rechazados</p>
                </a>
            </div>
        </div>
        <!-- List Content -->
        <div class="space-y-3 p-4" id="verification-list">
            <!-- Dynamic Content -->
            <div
                class="animate-pulse flex gap-4 p-4 bg-white dark:bg-[#1a2e1f] rounded-xl border border-[#dbe6df] dark:border-[#2a3d31]">
                <div class="size-12 bg-gray-200 dark:bg-white/10 rounded-lg"></div>
                <div class="flex-1 space-y-2">
                    <div class="h-4 bg-gray-200 dark:bg-white/10 rounded w-3/4"></div>
                    <div class="h-3 bg-gray-200 dark:bg-white/10 rounded w-1/2"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../common/js/dataManager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderList();
        });

        function renderList() {
            const container = document.getElementById('verification-list');
            const businesses = DataManager.getBusinesses().filter(b => b.status === 'pending');

            if (businesses.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 opacity-60">
                        <span class="material-symbols-outlined text-4xl mb-2">assignment_turned_in</span>
                         <p>No hay solicitudes pendientes.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = businesses.map(bus => `
            <div class="bg-white dark:bg-[#1a2e1f] rounded-xl border border-[#dbe6df] dark:border-[#2a3d31] overflow-hidden shadow-sm">
                <div class="flex gap-4 p-4 items-start">
                    <div class="text-[#111813] dark:text-primary flex items-center justify-center rounded-lg bg-[#f0f4f2] dark:bg-[#25382b] shrink-0 size-12">
                        <span class="material-symbols-outlined">storefront</span>
                    </div>
                    <div class="flex flex-1 flex-col">
                        <div class="flex justify-between items-start">
                            <p class="text-[#111813] dark:text-white text-base font-bold leading-tight line-clamp-1">${bus.name}</p>
                            <span class="inline-flex items-center rounded-md bg-yellow-100 dark:bg-yellow-900/30 px-2 py-1 text-xs font-medium text-yellow-800 dark:text-yellow-200">Pendiente</span>
                        </div>
                        <p class="text-[#61896f] text-sm mt-1 font-mono">Owner ID: ${bus.ownerId}</p>
                        <p class="text-[#61896f] text-xs mt-0.5">Creado: ${new Date(bus.createdAt).toLocaleDateString()}</p>
                    </div>
                </div>
                <div class="flex gap-2 px-4 pb-4">
                    <button onclick="handleAction('${bus.id}', 'verified')"
                        class="flex-1 flex cursor-pointer items-center justify-center rounded-lg h-9 px-3 bg-primary text-[#111813] text-xs font-bold transition hover:opacity-90">
                        <span class="material-symbols-outlined text-sm mr-1">check_circle</span> Aprobar
                    </button>
                    <button onclick="handleAction('${bus.id}', 'rejected')"
                        class="flex-1 flex cursor-pointer items-center justify-center rounded-lg h-9 px-3 bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 text-xs font-bold transition hover:opacity-90">
                        <span class="material-symbols-outlined text-sm mr-1">cancel</span> Rechazar
                    </button>
                </div>
            </div>
            `).join('');
        }

        function handleAction(id, status) {
            if (confirm(`¿Estás seguro de ${status === 'verified' ? 'aprobar' : 'rechazar'} este negocio?`)) {
                DataManager.updateBusinessStatus(id, status);
                renderList();
            }
        }
    </script>
    </div>
    <!-- Floating Action Summary -->
    <div
        class="fixed bottom-0 w-full max-w-xl mx-auto left-0 right-0 bg-white/80 dark:bg-[#1a2e1f]/80 backdrop-blur-md border-t border-[#dbe6df] dark:border-[#2a3d31] p-4 flex justify-between items-center z-50">
        <div class="flex flex-col">
            <p class="text-xs text-[#61896f] uppercase font-bold tracking-wider">Total Pendientes</p>
            <p class="text-xl font-bold text-[#111813] dark:text-white">24 Negocios</p>
        </div>
        <button
            class="bg-primary hover:brightness-105 active:scale-95 transition-all text-[#111813] font-bold px-6 py-3 rounded-xl shadow-lg flex items-center gap-2">
            <span class="material-symbols-outlined">bolt</span>
            Revisión Rápida
        </button>
    </div>
</body>

</html>
